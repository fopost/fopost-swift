name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Report the toolchain
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v
