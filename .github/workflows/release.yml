name: Release

# Swift packages are distributed by git tag — Swift Package Manager resolves
# them straight from the repository and the Swift Package Index picks the tag
# up, so there is no registry to push to. This workflow gates the tag on a
# green build and cuts the GitHub Release that people read.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate the package manifest
        run: swift package describe --type json > /dev/null

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Verify the tag matches the SDK version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(sed -n 's/^public let fopostVersion = "\(.*\)"$/\1/p' Sources/FoPost/FoPost.swift)
          [ "$VERSION" = "$TAG" ] || { echo "::error::FoPost.swift says $VERSION but the tag is $TAG"; exit 1; }

      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
